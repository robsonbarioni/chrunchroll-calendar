<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Week — lançamentos da semana</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📺</text></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Anime Week</h1>
  </div>

  <nav class="weeknav" aria-label="Navegação de semanas">
    <button id="prev" class="btn icon" title="Semana anterior" aria-label="Semana anterior">‹</button>
    <button id="today" class="btn" title="Voltar para a semana atual">Hoje</button>
    <button id="next" class="btn icon" title="Semana seguinte" aria-label="Semana seguinte">›</button>
    <span id="range" class="range"></span>
  </nav>

  <div class="actions">
    <span id="freshness" class="fresh" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span id="freshnessText"></span>
    </span>
    <label class="toggle" title="Mostrar apenas séries favoritadas">
      <input type="checkbox" id="favOnly">
      <span>★ Só favoritos</span>
    </label>
    <label class="toggle" id="projToggle"
           title="Nos dias que ainda não chegaram, repetir o que saiu na semana passada">
      <input type="checkbox" id="showProj" checked>
      <span>Previsões</span>
    </label>
    <button id="openFavs" class="btn">Gerenciar séries</button>
    <button id="refresh" class="btn primary" title="Buscar novos lançamentos no Crunchyroll">Atualizar</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <section id="calendar" class="calendar" aria-live="polite"></section>
  <p id="meta" class="meta"></p>
</main>

<!-- Painel de gerenciamento de séries / favoritos -->
<aside id="drawer" class="drawer" hidden aria-label="Gerenciar séries">
  <div class="drawer-head">
    <h2>Séries</h2>
    <button id="closeFavs" class="btn icon" aria-label="Fechar">×</button>
  </div>
  <p class="drawer-hint">
    Marque as séries que você acompanha. O filtro <strong>★ Só favoritos</strong>
    passa a mostrar apenas elas.
  </p>
  <input type="search" id="seriesSearch" class="search" placeholder="Buscar série…" autocomplete="off">
  <div class="drawer-tools">
    <button id="backfillBtn" class="btn small" title="Buscar todo o histórico de episódios das séries favoritadas">
      Preencher histórico dos favoritos
    </button>
  </div>
  <div id="seriesList" class="series-list"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
