<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Week</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📺</text></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1 data-i18n="app.name">Anime Week</h1>
  </div>

  <nav class="weeknav" aria-label="Week navigation">
    <button id="prev" class="btn icon"
            data-i18n-title="nav.prev" data-i18n-label="nav.prev">‹</button>
    <button id="today" class="btn"
            data-i18n="nav.today" data-i18n-title="nav.todayTitle">Today</button>
    <button id="next" class="btn icon"
            data-i18n-title="nav.next" data-i18n-label="nav.next">›</button>
    <span id="range" class="range"></span>
  </nav>

  <div class="actions">
    <span id="freshness" class="fresh" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span id="freshnessText"></span>
    </span>

    <label class="toggle" data-i18n-title="toggle.favoritesTitle">
      <input type="checkbox" id="favOnly">
      <span data-i18n="toggle.favorites">★ Favorites only</span>
    </label>

    <label class="toggle" data-i18n-title="toggle.projectionsTitle">
      <input type="checkbox" id="showProj" checked>
      <span data-i18n="toggle.projections">Forecast</span>
    </label>

    <button id="openFavs" class="btn" data-i18n="action.manage">Manage series</button>

    <button id="refresh" class="btn primary"
            data-i18n="action.refresh" data-i18n-title="action.refreshTitle">Refresh</button>

    <div id="langs" class="langs">
      <button id="langBtn" class="lang-btn" type="button"
              aria-haspopup="listbox" aria-expanded="false" data-i18n-label="lang.label"></button>
      <ul id="langMenu" class="lang-menu" role="listbox" tabindex="-1" hidden
          data-i18n-label="lang.label"></ul>
    </div>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <section id="calendar" class="calendar" aria-live="polite"></section>
  <p id="meta" class="meta"></p>
</main>

<!-- Painel de gerenciamento de séries / favoritos -->
<aside id="drawer" class="drawer" hidden data-i18n-label="drawer.title">
  <div class="drawer-head">
    <h2 data-i18n="drawer.title">Series</h2>
    <button id="closeFavs" class="btn icon" data-i18n-label="action.close">×</button>
  </div>
  <p class="drawer-hint" data-i18n="drawer.hint"></p>
  <input type="search" id="seriesSearch" class="search" autocomplete="off"
         data-i18n-placeholder="drawer.search">
  <div class="drawer-tools">
    <button id="backfillBtn" class="btn small"
            data-i18n="drawer.backfill" data-i18n-title="drawer.backfillTitle"></button>
  </div>
  <div id="seriesList" class="series-list"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
